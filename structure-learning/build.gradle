dependencies {
    api project(":connector-mongo")
    api project(":features")
    api project(":parsers")
    api project(":protobufs")
    api project(":schema-service")
    api project(":features-service")

    api group: 'org.apache.flink', name: 'flink-streaming-java_2.12', version: '1.11.2'
    testImplementation group: 'junit', name: 'junit', version: '4.12'
}

test {
    // The golden-file unit tests read the sample datasets shared with integration-tests.
    inputs.dir "$rootDir/integration-tests/src/integration-test/resources/samples"
}

// Rewrites integration-tests/.../samples/*/features.json from the current feature-learning code.
tasks.register('regenerateGoldenFeatures', JavaExec) {
    group = 'verification'
    description = 'Regenerates the features.json golden files by running feature learning on the samples.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hilohq.hilo.structure_learning.GoldenFeatures'
    workingDir = projectDir
}
