plugins {
    id 'application'
}

version = '0.0.1'
application {
    mainClass = 'com.hilohq.hilo.hilo_tool.HiloTool'
}

dependencies {
    api project(":pipelines")
    api project(":pipelines-service")
    api group: 'commons-cli', name: 'commons-cli', version: '1.4'
    testImplementation group: 'junit', name: 'junit', version: '4.12'
}
