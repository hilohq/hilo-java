sourceSets {
    integrationTest {
        java {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
            srcDir file('src/integration-test/java')
        }
        resources.srcDir file('src/integration-test/resources')
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

task stopDockerCompose(type: Exec) {
    workingDir "."
    commandLine './scripts/docker-stop.sh'
}

task startDockerCompose(type: Exec) {
    workingDir "."
    commandLine './scripts/docker-start.sh'
}

task integrationTest(type: Test) {
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
}

tasks.integrationTest.dependsOn("shadowJar", "startDockerCompose")
//tasks.integrationTest.finalizedBy("stopDockerCompose")

dependencies {
    api project(":connector-mongo")
    api project(":integration-prometheus")
    api project(":integrations-service")
    api project(":features-service")
    api project(":pipelines")
    api project(":protobufs")
    api project(":schema-service")
    api project(":structure-learning")

    api group: 'com.google.protobuf', name: 'protobuf-java-util', version: '3.0.0-beta-1'
    api group: 'org.apache.flink', name: 'flink-clients_2.12', version: '1.11.2'
    api group: 'org.apache.flink', name: 'flink-connector-kafka_2.12', version: '1.11.2'
    api group: 'de.javakaffee', name: 'kryo-serializers', version: '0.45'
    api group: 'io.grpc', name: 'grpc-testing', version: '1.33.1'

    testImplementation group: 'junit', name: 'junit', version: '4.12'
}
