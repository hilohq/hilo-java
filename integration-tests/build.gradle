plugins {
    id 'com.github.sherter.google-java-format' version '0.8'
}

apply plugin: 'com.github.sherter.google-java-format'

sourceSets {
    integrationTest {
        java {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
            srcDir file('src/integration-test/java')
        }
        resources.srcDir file('src/integration-test/resources')
    }
}

configurations {
    integrationTestCompile.extendsFrom testCompile
    integrationTestRuntime.extendsFrom testRuntime
}

task integrationTest(type: Test) {
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
}

tasks.integrationTest.dependsOn("shadowJar")

dependencies {
    compile project(":connectors")
    compile project(":protobufs")
    compile project(":schema-service")
    compile project(":structure-learning")

    compile group: 'com.google.protobuf', name: 'protobuf-java-util', version: '3.0.0-beta-1'
    compile group: 'org.apache.flink', name: 'flink-clients_2.12', version: '1.11.2'
    compile group: 'org.apache.flink', name: 'flink-connector-kafka_2.12', version: '1.11.2'
    compile group: 'de.javakaffee', name: 'kryo-serializers', version: '0.45'
    compile group: 'io.grpc', name: 'grpc-testing', version: '1.33.1'

    testCompile group: 'junit', name: 'junit', version: '4.12'
}
