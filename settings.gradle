plugins {
    // Lets Gradle download a matching JDK when the requested toolchain is not installed locally.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'hilo'

include 'config'
include 'protobufs'
include 'connector-mongo'
include 'integration-jdbc'
include 'integration-influxdb'
include 'integration-prometheus'
include 'integration-grafana'
include 'parsers'
include 'features'
include 'structure-learning'
include 'schema-service'
include 'schema-server'
include 'features-service'
include 'features-server'
include 'integrations-service'
include 'pipelines'
include 'pipelines-service'
include 'integration-tests'
include 'hilo-tool'
