plugins {
    id 'com.google.protobuf' version '0.9.4'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.12.1'
    }

    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.31.1"
        }
    }

    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
    // Generated sources go to build/generated/source/proto/main/{java,grpc} (plugin default).
}

dependencies {
    api group: 'com.google.protobuf', name: 'protobuf-java', version: '3.12.1'
    api 'io.grpc:grpc-netty-shaded:1.31.1'
    api 'io.grpc:grpc-protobuf:1.31.1'
    api 'io.grpc:grpc-stub:1.31.1'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}
