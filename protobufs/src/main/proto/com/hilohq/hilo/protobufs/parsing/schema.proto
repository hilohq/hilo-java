syntax = "proto3";

package hilo.protobufs.parsing;

option java_package = "com.hilohq.hilo.protobufs.parsing";

import "com/hilohq/hilo/protobufs/parsing/json.proto";

message SchemaFieldStats {
  oneof field {
    JsonFieldStats json = 1;
  }
}

message SchemaField {
  oneof field {
    JsonField json = 1;
  }
}

message SchemaFields {
  oneof schema {
    JsonSchema json = 1;
  }
}

message SchemaStats {
  oneof stats {
    JsonSchemaStats json = 1;
  }
}

message SchemaParseError {
  string content = 1;
  string reason = 2;
  string description = 3;
}

message SchemaEventData {
  message SchemaEventParseStats {
    int64 parse_attempt_count = 1;
    int64 parse_error_count = 2;
    int64 parse_success_count = 3;
  }

  message SchemaEventParseErrors {
    repeated SchemaParseError parse_errors = 1;
  }

  message SchemaEventFieldStats {
    SchemaFieldStats field_stats = 1;
  }

  oneof event {
    SchemaEventFieldStats field_stats = 1;
    SchemaEventParseStats parse_stats = 2;
    SchemaEventParseErrors parse_errors = 3;
  }
}

message SchemaParseUpdates {
  message SchemaFieldCreate {
    SchemaField field = 1;
  }

  message SchemaFieldUpdate {
    SchemaField previous_field = 1;
    SchemaField next_field = 2;
  }

  oneof update {
    SchemaFieldCreate field_create = 1;
    SchemaFieldUpdate field_update = 2;
  }
}

message SchemaMetadata {
  string project_id = 1;
  string source_id = 2;
  string schema_id = 3;
}

message SchemaParseStats {
  int64 parse_attempt_count = 1;
  int64 parse_error_count = 2;
  int64 parse_success_count = 3;
}

message SchemaParseErrors {
  repeated SchemaParseError parse_errors = 1;
}

message SchemaUpdateData {
  oneof update {
    SchemaFields fields = 1;
    SchemaParseStats parse_stats = 2;
    SchemaParseErrors parse_errors = 3;
    SchemaParseUpdates parse_updates = 4;
  }
}

message SchemaUpdate {
  SchemaMetadata metadata = 1;
  SchemaUpdateData data = 2;
}

message SchemaEvent {
  SchemaMetadata metadata = 1;
  SchemaEventData data = 2;
}
