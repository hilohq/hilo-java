syntax = "proto3";

package hilo.protobufs.parsing;

option java_package = "com.hilohq.hilo.protobufs.parsing";

message JsonTypeHistogram {
  int64 null_count = 1;
  int64 boolean_count = 2;
  int64 object_count = 3;
  int64 array_count = 4;
  int64 float_count = 5;
  int64 string_count = 6;
  int64 integer_count = 7;
}

enum JsonType {
  BOOLEAN = 0;
  INTEGER = 1;
  FLOAT = 2;
  STRING = 3;
  ARRAY = 4;
  NULL = 5;
  OBJECT = 6;
}

message JsonFieldStats {
  string path = 1;
  string name = 2;
  JsonTypeHistogram type_histogram = 3;
}

message JsonField {
  string path = 1;
  string name = 2;
  JsonType type = 3;
}

message JsonSchemaStats {
  repeated JsonFieldStats fields_stats = 1;
}

message JsonSchema {
  repeated JsonField fields = 1;
}