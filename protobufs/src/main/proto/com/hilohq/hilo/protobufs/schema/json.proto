syntax = "proto3";

package hilo.protobufs.schema;

option java_package = "com.hilohq.hilo.protobufs.schema";

enum JsonType {
  BOOLEAN = 0;
  INTEGER = 1;
  FLOAT = 2;
  STRING = 3;
  ARRAY = 4;
  NULL = 5;
  OBJECT = 6;
}

message JsonTypeHistogram {
  int64 null_count = 1;
  int64 boolean_count = 2;
  int64 object_count = 3;
  int64 array_count = 4;
  int64 float_count = 5;
  int64 string_count = 6;
  int64 integer_count = 7;
}

message JsonFieldStats {
  JsonTypeHistogram type_histogram = 1;
}

message JsonField {
  string field_id = 1;
  string path = 2;
  string name = 3;
  JsonType type = 4;
}

message JsonFieldModel {
  JsonField field = 1;
  JsonFieldStats stats = 2;
}

message JsonParseStats {
  int64 parse_attempt_count = 1;
  int64 parse_error_count = 2;
  int64 parse_success_count = 3;
}

message JsonParseError {
  string content = 1;
  string reason = 2;
  string description = 3;
}

message JsonParseErrorsModel {
  repeated JsonParseError parse_errors = 1;
}

message JsonSchemaEvent {
  message ParseStats {
    repeated JsonParseStats stats = 1;
  }

  message ParseErrors {
    repeated JsonParseError parse_errors = 1;
  }

  message FieldStats {
    string path = 1;
    string name = 2;
    JsonFieldStats field_stats = 3;
  }

  oneof event {
    FieldStats field_stats = 1;
    ParseStats parse_stats = 2;
    ParseErrors parse_errors = 3;
  }
}

message JsonFieldCreateModel {
  JsonField field = 1;
}

message JsonFieldUpdateModel {
  JsonField field_old = 1;
  JsonField field_new = 2;
}

message JsonLogsModel {
  oneof logs {
    JsonFieldCreateModel field_create = 1;
    JsonFieldUpdateModel field_update = 2;
  }
}

message JsonSchemaUpdate {
  message FieldLogs {
    JsonLogsModel field_logs = 1;
  }

  message ParseErrors {
    JsonParseErrorsModel parse_errors = 1;
  }

  message SchemaUpdate {
    JsonSchemaModel schema = 1;
  }

  oneof update {
    FieldLogs field_logs = 1;
    ParseErrors parse_errors = 2;
    SchemaUpdate schema_update = 3;
  }
}

message JsonSchemaModel {
  JsonParseStats stats = 1;
  map<string, JsonFieldModel> fields = 16;
}
