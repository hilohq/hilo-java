syntax = "proto3";

package hilo.protobufs.structure;

option java_package = "com.hilohq.hilo.protobufs.structure";

import "com/hilohq/hilo/protobufs/structure/json.proto";
import "com/hilohq/hilo/protobufs/structure/mysql.proto";
import "com/hilohq/hilo/protobufs/structure/text.proto";

message SchemaMetadata {
  string schema_id = 1;
  string source_id = 2;
  string project_id = 3;
}

message SchemaUpdate {
  SchemaMetadata metadata = 1;

  oneof update {
    JsonUpdate json = 16;
    TextUpdate text = 17;
    MysqlUpdate mysql = 18;
  }
}

message SchemaEvent {
  SchemaMetadata metadata = 1;

  oneof event {
    JsonEvent json = 16;
    TextEvent text = 17;
    MysqlEvent mysql = 18;
  }
}

message SchemaFieldsModel {
  SchemaMetadata metadata = 1;

  oneof schema {
    JsonField json = 16;
    TextField text = 17;
    MysqlField mysql = 18;
  }
}

message SchemaLogsModel {
  SchemaMetadata metadata = 1;

  oneof schema {
    JsonLog json = 16;
    TextLog text = 17;
    MysqlLog mysql = 18;
  }
}
