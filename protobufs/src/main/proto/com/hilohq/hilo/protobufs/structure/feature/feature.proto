syntax = "proto3";

package hilo.protobufs.structure.feature;

option java_package = "com.hilohq.hilo.protobufs.structure.feature";

message FeaturesMetadata {
  string schema_id = 1;
  string source_id = 2;
  string project_id = 3;
}

message FeatureClass {
  message IntEnum {
    repeated int64 values = 1;
  }

  message BooleanEnum { }

  message StringEnum {
    repeated string values = 1;
  }

  message Gauge {
    int64 scale = 1;
  }

  message Counter { }

  message Monotonic { }

  message Distance {
    string units = 1;
  }

  message Duration {
    string units = 1;
  }

  message Timestamp { }

  message Set {
    repeated string values = 1;
  }

  message Ephemeral { }

  message Discrete { }

  oneof feature {
    BooleanEnum bool_enum = 1;
    IntEnum int_enum = 2;
    StringEnum string_enum = 3;
    Gauge gauge = 4;
    Discrete discrete = 5;
    Counter counter = 6;
    Monotonic monotonic = 7;
    Distance distance = 8;
    Duration duration = 9;
    Timestamp timestamp = 10;
    Set set = 11;
    Ephemeral ephemeral = 12;
  }
}

message Feature {
  string key = 1;
  FeatureClass feature_class = 2;
  FeatureStats stats = 3;
}

message BooleanStats {
  message Histogram {
    message Bucket {
      bool value = 1;
      int64 count = 2;
    }

    repeated Bucket buckets = 1;
  }

  int64 count = 1;
  Histogram histogram = 2;
}

message NumericStats {
  message ValueStats {
    int64 count = 1;
    double min = 2;
    double max = 3;
    double mean = 4;
    double standard_deviation = 5;
    double continuityScore = 6;
    string base64_stats_repr = 9;
  }

  message PercentileHistogram {
    message Bucket {
      double min = 1;
      double max = 2;
      int64 count = 3;
      double boundary = 4;
    }

    repeated Bucket buckets = 1;
    repeated double boundaries = 2;
  }


  ValueStats value_stats = 1;
  ValueStats continuity_stats = 2;
  PercentileHistogram value_histogram = 3;
  PercentileHistogram differential_histogram = 4;
}

message StringStats {
  message Histogram {
    message Bucket {
      string value = 1;
      int64 count = 2;
    }

    repeated Bucket buckets = 2;
  }

  int64 count = 1;
  Histogram histogram = 2;
}

message FeatureStats {
  BooleanStats boolean_stats = 1;
  NumericStats int_stats = 2;
  NumericStats long_stats = 3;
  NumericStats float_stats = 4;
  NumericStats double_stats = 5;
  StringStats string_stats = 6;
  StringStats bytes_stats = 7;
}

message StatsEvent {
  string key = 1;
  FeatureStats feature_stats = 2;
}

message FeaturesEvent {
  FeaturesMetadata metadata = 1;

  oneof event {
    StatsEvent stats = 16;
  }
}

message FeatureCreate {
  string key = 1;
  FeatureClass feature_class = 2;
}

message FeatureUpdate {
  message Feature {
    string key = 1;
    FeatureClass feature_class = 2;
  }

  Feature before = 1;
  Feature after = 2;
}

message FeatureLog {
  oneof log {
    FeatureCreate feature_create = 1;
    FeatureUpdate feature_update = 2;
  }
}

message FeaturesUpdate {
  FeaturesMetadata metadata = 1;

  oneof update {
    FeatureLog log = 16;
    Feature feature = 17;
  }
}

message FeatureLogsModel {
  FeaturesMetadata metadata = 1;
  FeatureLog logs = 2;
}

message FeaturesModel {
  FeaturesMetadata metadata = 1;
  map<string, Feature> features = 2;
}