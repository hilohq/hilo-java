syntax = "proto3";

package hilo.protobufs.stats;

option java_package = "com.hilohq.hilo.protobuf.stats";

import "com/hilohq/hilo/protobufs/stats/histogram.proto";

message BooleanStats {
  int64 count = 1;
  BooleanHistogram histogram = 2;
}

message NumericStats {
  int64 count = 1;
  double min = 2;
  double max = 3;
  double mean = 4;
  double standard_deviation = 5;
  NumericPercentileHistogram value_histogram = 6;
  NumericPercentileHistogram differential_histogram = 7;
  string base64_stats_repr = 8;
}

message StringStats {
  int64 count = 1;
  StringHistogram histogram = 2;
}
