syntax = "proto3";

package hilo.protobufs.schema;

option java_package = "com.hilohq.hilo.protobufs.parser";

enum JsonType {
  BOOLEAN = 0;
  INTEGER = 1;
  FLOAT = 2;
  STRING = 3;
  ARRAY = 4;
  NULL = 5;
  OBJECT = 6;
}

message JsonProperty {
  JsonType type = 1;
}

message JsonNode {
  oneof node {

  }
}

message JsonObject {
  string type = 1;
}
