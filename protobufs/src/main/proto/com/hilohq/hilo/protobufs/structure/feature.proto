syntax = "proto3";

package hilo.protobufs.structure;

option java_package = "com.hilohq.hilo.protobufs.structure";

enum FeatureType {
  FEATURE_BOOLEAN = 0;
  FEATURE_INTEGER = 1;
  FEATURE_LONG = 2;
  FEATURE_FLOAT = 3;
  FEATURE_DOUBLE = 4;
  FEATURE_STRING = 5;
  FEATURE_BYTES = 6;
}

message Feature {
  string key = 1;
  FeatureType type = 2;
  FeatureStats stats = 3;
}

message BooleanStats {
  message Histogram {
    message Bucket {
      bool value = 1;
      int64 count = 2;
    }

    repeated Bucket buckets = 1;
  }

  int64 count = 1;
  Histogram histogram = 2;
}

message NumericStats {
  message PercentileHistogram {
    message Bucket {
      double min = 1;
      double max = 2;
      int64 count = 3;
      double boundary = 4;
    }

    repeated Bucket buckets = 1;
    repeated double boundaries = 2;
  }

  int64 count = 1;
  double min = 2;
  double max = 3;
  double mean = 4;
  double standard_deviation = 5;
  PercentileHistogram value_histogram = 6;
  PercentileHistogram differential_histogram = 7;
  string base64_stats_repr = 8;
}

message StringStats {
  message Histogram {
    message Bucket {
      string value = 1;
      int64 count = 2;
    }

    repeated Bucket buckets = 2;
  }

  int64 count = 1;
  Histogram histogram = 2;
}

message FeatureStats {
  oneof stats {
    BooleanStats boolean_stats = 1;
    NumericStats numeric_stats = 2;
    StringStats string_stats = 3;
  }
}

message FeaturesEvent {
  message Stats {
    string key = 1;
    FeatureStats feature_stats = 2;
  }

  oneof event {
    Stats stats = 1;
  }
}

message FeatureCreate {
  string key = 1;
  FeatureType type = 2;
}

message FeatureUpdate {
  message Feature {
    string key = 1;
    FeatureType type = 2;
  }

  Feature before = 1;
  Feature after = 2;
}

message FeatureLog {
  oneof log {
    FeatureCreate feature_create = 1;
    FeatureUpdate feature_update = 2;
  }
}

message FeaturesUpdate {
  oneof update {
    FeatureLog log = 1;
    Features features = 2;
  }
}

message FeatureLogsModel {
  FeatureLog logs = 1;
}

message Features {
  repeated Feature feature = 1;
}

message FeaturesModel {
  Features features = 1;
}