syntax = "proto3";

package hilo.protobufs.structure;

option java_package = "com.hilohq.hilo.protobufs.structure";

enum JsonType {
  JSON_BOOLEAN = 0;
  JSON_NUMBER = 1;
  JSON_STRING = 2;
  JSON_ARRAY = 3;
  JSON_NULL = 4;
  JSON_OBJECT = 5;
  JSON_BINARY = 6;
}

message JsonTypeHistogram {
  int64 null_count = 1;
  int64 boolean_count = 2;
  int64 object_count = 3;
  int64 array_count = 4;
  int64 number_count = 5;
  int64 string_count = 6;
  int64 binary_count = 7;
}

message JsonFieldStats {
  JsonTypeHistogram type_histogram = 1;
}

message JsonField {
  string key = 1;
  string path = 2;
  string name = 3;
  JsonType type = 4;
  JsonFieldStats stats = 5;
}

message JsonParseStats {
  int64 parse_attempt_count = 1;
  int64 parse_error_count = 2;
  int64 parse_success_count = 3;
}

message JsonEvent {
  message ParseStats {
    JsonParseStats parse_stats = 1;
  }

  message FieldStats {
    string key = 1;
    string path = 2;
    string name = 3;
    JsonFieldStats field_stats = 4;
  }

  oneof event {
    FieldStats field_stats = 1;
    ParseStats parse_stats = 2;
  }
}

message JsonFieldCreate {
  string key = 1;
  string path = 2;
  string name = 3;
  JsonType type = 4;
}

message JsonFieldUpdate {
  message Field {
    string key = 1;
    string path = 2;
    string name = 3;
    JsonType type = 4;
  }

  Field before = 1;
  Field after = 2;
}

message JsonUpdate {
  oneof update {
    JsonLog log = 1;
    JsonField field = 2;
  }
}

message JsonFields {
  JsonParseStats parse_stats = 1;
  map<string, JsonField> fields = 2;
}

message JsonLog {
  oneof log {
    JsonFieldCreate field_create = 1;
    JsonFieldUpdate field_update = 2;
  }
}
