name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      integration-tests:
        description: "Also run the Docker-based integration tests"
        type: boolean
        default: false

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The build uses a Java 17 toolchain; providing Temurin 17 means Gradle need not download one.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build and run unit tests
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/"

  integration-tests:
    name: Integration tests (manual)
    # Needs Docker (Flink, MongoDB, Kafka, ZooKeeper), so it only runs on demand.
    if: github.event_name == 'workflow_dispatch' && inputs.integration-tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # scripts/docker-*.sh call the standalone `docker-compose` CLI; map it to Compose v2.
      - name: Provide docker-compose
        run: |
          if ! command -v docker-compose >/dev/null; then
            printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
            sudo chmod +x /usr/local/bin/docker-compose
          fi

      - name: Run integration tests
        run: ./gradlew :integration-tests:integrationTest

      - name: Stop Docker Compose stack
        if: always()
        working-directory: integration-tests
        run: ./scripts/docker-stop.sh
